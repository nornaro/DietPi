name: DietPi-Build-RV64
on:
  workflow_dispatch:
    inputs:
      buildargs:
        description: 'Target: rv64 (both), -m 16 -d 8 (Star64), or -m 15 -d 8 (VF2)'
        required: true
        default: 'rv64'
      testkernel:
        description: 'Install test kernel'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.buildargs }}
  cancel-in-progress: true

jobs:
  prep:
    outputs:
      buildargs: ${{ steps.buildargs.outputs.buildargs }}
    runs-on: ubuntu-24.04
    steps:
      - id: buildargs
        run: |
          if [ "${{ github.event.inputs.buildargs }}" = 'rv64' ]
          then
            echo 'buildargs=["-m 16 -d 8", "-m 15 -d 8"]' >> "$GITHUB_OUTPUT"
          else
            echo 'buildargs=["${{ github.event.inputs.buildargs }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prep
    strategy:
      matrix:
        buildargs: ${{ fromJson(needs.prep.outputs.buildargs) }}
      fail-fast: false
    name: "Build: ${{ matrix.buildargs }}"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Run DietPi-Build
        run: |
          # 1. Prepare the environment
          sudo systemctl --now mask ssh ssh.socket systemd-resolved azure-proxy-agent
          echo 'nameserver 1.1.1.1' | sudo tee /etc/resolv.conf > /dev/null

          # 2. Build the arguments string
          buildargs='-m 84 -d 8'
          [ "true" == 'true' ] && buildargs="$buildargs --test-kernel"

          # 3. Execute the build (NOTICE: --sign and --upload-script are GONE)
          sudo bash -c "G_GITOWNER=$GITHUB_REPOSITORY_OWNER G_GITBRANCH=$GITHUB_REF_NAME; $(curl -sSf "https://raw.githubusercontent.com/$GITHUB_REPOSITORY_OWNER/DietPi/$GITHUB_REF_NAME/.build/images/dietpi-build" || echo false)" -- $buildargs

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DietPi-Image-${{ strategy.job-index }}
          path: |
            *.7z
            *.xz
            *.img
          if-no-files-found: warn